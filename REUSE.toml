# Licence information for files that cannot carry a comment header.
# See https://reuse.software/spec/ and docs/adr/0002-project-license-gpl-3-0-or-later.md.
version = 1

[[annotations]]
path = [
    "src/main/resources/credits/components.json",
    ".mvn/jvm.config",
    ".mvn/wrapper/maven-wrapper.properties",
]
SPDX-FileCopyrightText = "2026 Chetan and contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Output captured from external tools, used as test fixtures (see the README in that folder).
[[annotations]]
path = "src/test/resources/tool-output/**/*.txt"
SPDX-FileCopyrightText = "2026 Chetan and contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Maven wrapper scripts, generated by the Apache Maven Wrapper plugin.
[[annotations]]
path = ["mvnw", "mvnw.cmd"]
SPDX-FileCopyrightText = "The Apache Software Foundation"
SPDX-License-Identifier = "Apache-2.0"

# Third-party licence and notice texts shipped for the in-app credits screen.
# They are copied verbatim from the component they belong to and carry that component's terms.
[[annotations]]
path = [
    "src/main/resources/credits/licenses/openjdk-*.txt",
    "src/main/resources/credits/licenses/openjfx-*.txt",
    "src/main/resources/credits/notices/openjfx-*.txt",
]
SPDX-FileCopyrightText = "Oracle and/or its affiliates"
SPDX-License-Identifier = "GPL-2.0-only WITH Classpath-exception-2.0"

[[annotations]]
path = [
    "src/main/resources/credits/licenses/Apache-2.0.txt",
    "src/main/resources/credits/notices/jackson-*.txt",
]
SPDX-FileCopyrightText = "2007- Tatu Saloranta and the Jackson project"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = [
    "src/main/resources/credits/licenses/jackson-core-FastDoubleParser-LICENSE.txt",
    "src/main/resources/credits/licenses/jackson-core-FastDoubleParser-ThirdParty-LICENSE.txt",
]
SPDX-FileCopyrightText = "2024 Werner Randelshofer, Switzerland"
SPDX-License-Identifier = "MIT AND BSL-1.0 AND BSD-2-Clause"

[[annotations]]
path = "src/main/resources/credits/licenses/jackson-core-Schubfach-LICENSE.txt"
SPDX-FileCopyrightText = "2018-2020 Raffaello Giulietti"
SPDX-License-Identifier = "MIT"
