name: Feature request
description: Suggest an idea for RetroBurn
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe what you are trying to make or achieve, not just the feature.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could RetroBurn help?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have tried
