name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # The Linux integration tests build real ISO images and probe the real tools.
      - name: Install external tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso cdrskin genisoimage ffmpeg dvdauthor

      # Compiles, runs unit, integration and architecture tests, and checks formatting, licence
      # headers, credits completeness and coverage.
      - name: Verify (Linux)
        if: runner.os == 'Linux'
        run: ./mvnw -B verify

      - name: Verify (Windows)
        if: runner.os == 'Windows'
        run: .\mvnw.cmd -B verify

  compliance:
    name: Licence and repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: REUSE compliance
        uses: fsfe/reuse-action@v6

      # Private planning documents must never reach the repository.
      - name: No private documents committed
        run: |
          if git ls-files | grep -E '(^|/)REQUIREMENTS\.md$|^\.private/'; then
            echo "::error::Private planning documents are committed. Remove them and check .gitignore."
            exit 1
          fi
